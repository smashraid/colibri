services:
  web:
    image: ${REPOSITORY}/colibri-web:${BUILDNUMBER}
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        - BUILD_CONFIGURATION=production
        - NAME=colibri

  api:
    image: ${REPOSITORY}/colibri-api:${BUILDNUMBER}
    build:
      context: ./core/Colibri
      dockerfile: Colibri.Api/Dockerfile
      args:
        - BUILD_CONFIGURATION=Release