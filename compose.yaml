services:
  web:
    image: colibri-web:7.0
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        - BUILD_CONFIGURATION=production
        - NAME=colibri

  api:
    image: colibri-api:7.0
    #environment:
    #   - ASPNETCORE_URLS=http://+:80
    #   - ASPNETCORE_ENVIRONMENT=Development
    # ports:
    #   - 9000:80
    build:
      context: ./core/Colibri
      dockerfile: Colibri.Api/Dockerfile
      args:
        - BUILD_CONFIGURATION=Release

  job:
    image: colibri-job:7.0
    build:
      context: ./core/Colibri
      dockerfile: Colibri.Job/Dockerfile
      args:
        - BUILD_CONFIGURATION=Release

  job-datafeed:
    image: colibri-job-datafeed:7.0
    build:
      context: ./core/Colibri
      dockerfile: Colibri.Job.Datafeed/Dockerfile
      args:
        - BUILD_CONFIGURATION=Release
