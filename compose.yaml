services:
  web:
    image: ${REPOSITORY}/colibri-web:${BUILDNUMBER}
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        - BUILD_CONFIGURATION=production
        - NAME=colibri

  api:
    image: ${REPOSITORY}/colibri-api:${BUILDNUMBER}
    #environment:
    #   - ASPNETCORE_URLS=http://+:80
    #   - ASPNETCORE_ENVIRONMENT=Development
    # ports:
    #   - 9000:80
    build:
      context: ./core/Colibri
      dockerfile: Colibri.Api/Dockerfile
      args:
        - BUILD_CONFIGURATION=Release

  job:
    image: ${REPOSITORY}/colibri-job:${BUILDNUMBER}
    build:
      context: ./core/Colibri
      dockerfile: Colibri.Job/Dockerfile
      args:
        - BUILD_CONFIGURATION=Release

  job-datafeed:
    image: ${REPOSITORY}/colibri-job-datafeed:${BUILDNUMBER}
    build:
      context: ./core/Colibri
      dockerfile: Colibri.Job.Datafeed/Dockerfile
      args:
        - BUILD_CONFIGURATION=Release
