{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "colibri-web-chart.serviceAccountName" . }}
  labels:
    {{- include "colibri-web-chart.labels" . | nindent 4 }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.serviceAccount.role }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
