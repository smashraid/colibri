{{- if .Values.redisInsight.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "colibri-job-datafeed-chart.fullname" . }}-redis-insight
  labels:
    {{- include "colibri-job-datafeed-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis-insight
spec:
  type: {{ .Values.redisInsight.service.type }}
  ports:
    - port: {{ .Values.redisInsight.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "colibri-job-datafeed-chart.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: redis-insight
{{- end }}