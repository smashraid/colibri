{{- if .Values.valkey.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "colibri-job-datafeed-chart.fullname" . }}-valkey-config
  labels:
    {{- include "colibri-job-datafeed-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: valkey
data:
  valkey.conf: |
    port 6379
    timeout 0
    tcp-keepalive 300
    maxmemory {{ .Values.valkey.config.maxmemory }}
    maxmemory-policy {{ .Values.valkey.config.maxmemory-policy }}
    appendonly {{ .Values.valkey.config.appendonly }}
    auto-aof-rewrite-percentage {{ .Values.valkey.config.auto-aof-rewrite-percentage }}
    auto-aof-rewrite-min-size {{ .Values.valkey.config.auto-aof-rewrite-min-size }}
    {{- if .Values.valkey.auth.enabled }}
    requirepass ${VALKEY_PASSWORD}
    {{- end }}
{{- end }}