{{- if .Values.redisCommander.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "colibri-job-datafeed-chart.fullname" . }}-redis-commander
  labels:
    {{- include "colibri-job-datafeed-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis-commander
spec:
  type: {{ .Values.redisCommander.service.type }}
  ports:
    - port: {{ .Values.redisCommander.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "colibri-job-datafeed-chart.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: redis-commander
{{- end }}