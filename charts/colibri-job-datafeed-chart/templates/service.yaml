apiVersion: v1
kind: Service
metadata:
  name: {{ include "colibri-job-datafeed-chart.fullname" . }}
  labels: {{- include "colibri-job-datafeed-chart.labels" . | nindent 4 }}
spec:
  type: {{ .Values.app.service.type }}
  ports:
    - port: {{ .Values.app.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "colibri-job-datafeed-chart.selectorLabels" . | nindent 4 }}
