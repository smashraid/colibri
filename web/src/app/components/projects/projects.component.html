<mat-form-field>
  <mat-label>Project</mat-label>
  <mat-select (selectionChange)="onSelect($event)" >
    @for (project of projects$ | async; track project.id) {
    <mat-option [value]="project.projectId">{{
      project.website.replace(".com", "") | uppercase
    }}</mat-option>
    }
  </mat-select>
</mat-form-field>
