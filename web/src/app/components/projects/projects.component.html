<mat-form-field>
  <mat-label>Project</mat-label>
  <input
    type="text"
    placeholder="Select"
    aria-label="Project"
    matInput
    [formControl]="projectId"
    [matAutocomplete]="auto"
    id="projects"
    name="projects"
  />
  <mat-autocomplete #auto="matAutocomplete" [displayWith]="displayFn">
    @for (project of filteredList(); track project.id) {
    <mat-option [value]="project">{{
      project.website.replace(".com", "") | uppercase
    }}</mat-option>
    }
  </mat-autocomplete>
</mat-form-field>
