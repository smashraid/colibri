<mat-form-field>
  <mat-label>Project</mat-label>
  <mat-select (selectionChange)="onSelect($event)" [value]="store.projectId()">
    @for (project of store.projects(); track project.id) {
    <mat-option [value]="project.projectId">{{
      project.website.replace(".com", "") | uppercase
    }}</mat-option>
    }
  </mat-select>
</mat-form-field>
